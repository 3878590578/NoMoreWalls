#==================== 策略组 ====================
proxy-groups:
# 分流分组
  - name: 🚀 手动切换
    type: select
    proxies:
      - 🏠 自建节点          # 先把自建节点放在最上面，方便点选
      - ♻️ 自动选择
      - DIRECT
    use:
      - Sub                 # 墨鱼订阅
      - Sub2                # 你的第二个订阅

  - {name: 🌏 全球加速, <<: *a3}
  - {name: 🍎 苹果服务, <<: *a3}
  - {name: 📺 哔哩哔哩, type: select, proxies: [DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点]}
  - {name: 🤖 OpenAi,   type: select, proxies: [🇺🇲 美国节点]}
  - {name: 🎬 国际媒体, <<: *a3}
  - {name: 🌌 谷歌服务, <<: *a3}
  - {name: 📟 电报消息, <<: *a3}
  - {name: 🐦 推特服务, <<: *a3}
  - {name: 🎮 游戏平台, <<: *a3}
  - {name: 🆎 AdBlock, type: select, proxies: [REJECT]}
  - {name: 🐟 兜底分流, <<: *a3}

# 节点分组（含订阅+自建）
  - name: ♻️ 自动选择
    <<: *a4                      # 仅对 Sub 做自动测速
  - name: 🇭🇰 香港节点
    <<: *a4
    filter: "港|HK|(?i)Hong"
  - name: 🇯🇵 日本节点
    <<: *a4
    filter: "日|东京|JP|(?i)Japan"
  - name: 🇨🇳 台湾节点
    <<: *a4
    filter: "台|湾|TW|(?i)Taiwan"
  - name: 🇺🇲 美国节点
    <<: *a4
    filter: "美|US|(?i)States|American"
  - name: 🇸🇬 狮城节点
    <<: *a4
    filter: "新|坡|SG|(?i)Singapore"

  # 新增：自建节点独立分组，也可被别处引用
  - name: 🏠 自建节点
    type: select
    proxies:
      - 🇭🇰 香港01 | IEPL
      - 🇯🇵 日本01 | IEPL
      - 🇸🇬 新加坡01 | IEPL
      - 🇺🇸 美国01 | IEPL
      - DIRECT

